name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar
        run: dotnet build CenterAim.csproj -c Release
      - name: Listar scmod
        run: find . -name "*.scmod"
      - uses: actions/upload-artifact@v4
        with:
          name: CenterAim-scmod
          path: '**/*.scmod'